
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Transitions and Animations Challenge</title>
</head>

<body>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 24px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        .box {
            width: 300px;
            height: 350px;
            padding: 20px;
            background-color: white;
            border: solid 1px black;
            border-radius: 14px;
            position: relative;
            text-align: center;

            transition: all 0.3s ease-in-out;
        }

        .box:hover {
            background-color: lightblue;
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 20px gray;
        }

        .price {
            width: 75px;
            padding: 10px;
            text-align: center;
            background-color: lightpink;
            position: absolute;
            right: -20px;
            top: -10px;
            border-radius: 8px;

            animation: move 3s alternate infinite ease-in-out;
        }

        .product {
            font-size: 100px;
            margin: 20px auto;

            transition: transform 0.3s;
        }

        .box:hover .product {
            transform: rotate(15deg) scale(1.1);
        }

        h2 {
            margin-bottom: 15px;
        }

        button {
            background-color: royalblue;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;

            transition: all 0.3s;
        }

        button:hover {
            background-color: green;
            transform: scale(1.1);
        }

        button:active {
            background-color: red;
            transform: scale(0.9);
        }

        @keyframes move {

            0% {
                top: -10px;
                background-color: lightpink;
            }

            50% {
                top: 20px;
                background-color: lightgreen;
            }

            100% {
                top: 40px;
                background-color: lightblue;
            }

        }

    </style>

    <h1>Products Animation Challenge</h1>

    <div class="container">

        <div class="box">

            <div class="product">👕</div>

            <h2>T-Shirt</h2>

            <div class="price">1500</div>

            <button>Buy Now</button>

        </div>

        <div class="box">

            <div class="product">👟</div>

            <h2>Shoes</h2>

            <div class="price">2000</div>

            <button>Buy Now</button>

        </div>

        <div class="box">

            <div class="product">🎧</div>

            <h2>Headphones</h2>

            <div class="price">1200</div>

            <button>Buy Now</button>

        </div>

    </div>

</body>
</html>
